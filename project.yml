name: MojLibrus

options:
  bundleIdPrefix: com.olekd
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  MojLibrus:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.olekd.mojlibrus
        PRODUCT_NAME: MojLibrus
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        CLANG_ENABLE_MODULES: "YES"

  MojLibrusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MojLibrusTests
    dependencies:
      - target: MojLibrus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.olekd.mojlibrus.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MojLibrus.app/MojLibrus"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  MojLibrus:
    build:
      targets:
        MojLibrus: all
        MojLibrusTests: [test]
    test:
      targets:
        - MojLibrusTests
    run:
      config: Debug
    archive:
      config: Release
